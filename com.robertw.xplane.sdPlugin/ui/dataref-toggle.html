<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>X-Plane DataRef Toggle</title>
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
		<script src="xplane-pi-helpers.js"></script>
		<style>
			.live-preview {
				font-family: monospace;
				color: #aaa;
				font-size: 11px;
				word-break: break-all;
			}
			.live-preview[data-state="not-found"],
			.live-preview[data-state="error"] {
				color: #d97;
			}
			.image-upload {
				display: flex;
				align-items: center;
				gap: 8px;
				flex: 1;
			}
			.image-upload .thumb {
				width: 36px;
				height: 36px;
				border-radius: 4px;
				background: #2d2d2d center/contain no-repeat;
				border: 1px solid #444;
				flex: 0 0 auto;
				display: inline-block;
			}
			.image-upload .actions {
				display: flex;
				gap: 6px;
				flex: 1;
			}
			.image-upload button {
				cursor: pointer;
			}
			.image-upload input[type="file"] {
				display: none;
			}
			.image-upload .filename {
				color: #888;
				font-size: 11px;
				flex: 1;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
		</style>
	</head>
	<body>
		<sdpi-item label="DataRef Path">
			<sdpi-textfield
				setting="datarefPath"
				placeholder="sim/cockpit2/controls/gear_handle_down"
				id="datarefField"
				required
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Live Value">
			<span class="live-preview" id="datarefPreview"></span>
		</sdpi-item>
		<sdpi-item label="Value OFF">
			<sdpi-textfield
				setting="valueOff"
				placeholder="0"
				inputmode="decimal"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Value ON">
			<sdpi-textfield
				setting="valueOn"
				placeholder="1"
				inputmode="decimal"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Strict ON Match">
			<sdpi-checkbox setting="strictOnMatch">
				Treat only <code>value === Value ON</code> as ON (everything else is OFF)
			</sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Trigger Mode">
			<sdpi-select setting="triggerMode" default="write" id="triggerModeSelect">
				<option value="write">Write DataRef</option>
				<option value="command">Activate Command</option>
				<option value="command-on-off">On/Off Command</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Command Path" id="commandItem">
			<sdpi-textfield
				setting="commandPath"
				placeholder="sim/flight_controls/landing_gear_toggle"
				id="commandField"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Command Path ON" id="commandOnItem">
			<sdpi-textfield
				setting="commandOnPath"
				placeholder="sim/autopilot/servos_on"
				id="commandOnField"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Command Path OFF" id="commandOffItem">
			<sdpi-textfield
				setting="commandOffPath"
				placeholder="sim/autopilot/servos_off"
				id="commandOffField"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Image OFF">
			<div class="image-upload">
				<div class="thumb" id="thumbOff"></div>
				<div class="actions">
					<button type="button" id="pickOff">Choose…</button>
					<button type="button" id="clearOff">Reset</button>
				</div>
				<input type="file" id="fileOff" accept="image/png,image/jpeg,image/svg+xml" />
			</div>
		</sdpi-item>
		<sdpi-item label="Image ON">
			<div class="image-upload">
				<div class="thumb" id="thumbOn"></div>
				<div class="actions">
					<button type="button" id="pickOn">Choose…</button>
					<button type="button" id="clearOn">Reset</button>
				</div>
				<input type="file" id="fileOn" accept="image/png,image/jpeg,image/svg+xml" />
			</div>
		</sdpi-item>

		<script>
			(() => {
				const client = window.SDPIComponents?.streamDeckClient;
				if (!client) {
					console.error("SDPIComponents.streamDeckClient not available");
					return;
				}

				const thumbOff = document.getElementById("thumbOff");
				const thumbOn = document.getElementById("thumbOn");
				const fileOff = document.getElementById("fileOff");
				const fileOn = document.getElementById("fileOn");

				const setThumb = (el, dataUrl) => {
					el.style.backgroundImage = dataUrl ? `url("${dataUrl}")` : "";
				};

				const readAsDataURL = (file) =>
					new Promise((resolve, reject) => {
						const r = new FileReader();
						r.onload = () => resolve(String(r.result));
						r.onerror = () => reject(r.error);
						r.readAsDataURL(file);
					});

				// Stream Deck XL key resolution is 96px; @2x = 144px. Larger images
				// inflate the data URL into the action settings (each kilobyte is
				// shipped over the SD WS protocol on every read), and very large
				// data URLs have been observed to be silently dropped by the SD
				// software on state transitions. Downscale to 144x144 PNG before
				// persisting.
				const TARGET_PX = 144;
				const resizeToPng = (dataUrl) =>
					new Promise((resolve, reject) => {
						const img = new Image();
						img.onload = () => {
							const canvas = document.createElement("canvas");
							canvas.width = TARGET_PX;
							canvas.height = TARGET_PX;
							const ctx = canvas.getContext("2d");
							if (!ctx) {
								reject(new Error("Canvas 2D context unavailable"));
								return;
							}
							const scale = Math.min(
								TARGET_PX / img.width,
								TARGET_PX / img.height,
							);
							const w = img.width * scale;
							const h = img.height * scale;
							const x = (TARGET_PX - w) / 2;
							const y = (TARGET_PX - h) / 2;
							ctx.clearRect(0, 0, TARGET_PX, TARGET_PX);
							ctx.drawImage(img, x, y, w, h);
							resolve(canvas.toDataURL("image/png"));
						};
						img.onerror = () => reject(new Error("Image decode failed"));
						img.src = dataUrl;
					});

				// Local cache of the latest settings. We keep this in sync via the
				// didReceiveSettings stream so that updates triggered by other
				// sdpi-components inputs (datarefPath, valueOff, …) stay in our
				// baseline. setSettings() on Stream Deck *replaces* the entire
				// settings object — if we read a stale/empty baseline before
				// writing imageOn, every other field would be wiped (this is the
				// regression observed by the user when clicking Reset).
				let cached = null;
				let cacheReady = false;

				const refreshFromSdk = async () => {
					try {
						const s = await client.getSettings();
						if (s && typeof s === "object") cached = s;
					} catch (err) {
						console.error("getSettings failed", err);
					}
				};

				const commandItem = document.getElementById("commandItem");
				const commandOnItem = document.getElementById("commandOnItem");
				const commandOffItem = document.getElementById("commandOffItem");
				const triggerModeSelect = document.getElementById("triggerModeSelect");

				const applyModeVisibility = (mode) => {
					const m = mode === "command" || mode === "command-on-off" ? mode : "write";
					commandItem.style.display = m === "command" ? "" : "none";
					commandOnItem.style.display = m === "command-on-off" ? "" : "none";
					commandOffItem.style.display = m === "command-on-off" ? "" : "none";
				};

				// sdpi-components v4 does not consistently re-fire didReceiveSettings
				// when the user mutates a control directly in the PI. Listen to the
				// inner <select> change inside the component's shadow DOM as the
				// authoritative source for live mode switches. We still subscribe
				// to didReceiveSettings as a fallback for externally-driven changes.
				const findInnerSelect = (el) =>
					el?.shadowRoot?.querySelector("select") || el?.querySelector("select");
				const wireTriggerModeChange = async () => {
					for (let i = 0; i < 30; i++) {
						const inner = findInnerSelect(triggerModeSelect);
						if (inner) {
							inner.addEventListener("change", () => applyModeVisibility(inner.value));
							return;
						}
						await new Promise((r) => setTimeout(r, 50));
					}
					console.warn("dataref-toggle PI: could not wire triggerMode change listener");
				};
				wireTriggerModeChange();

				const ready = (async () => {
					await refreshFromSdk();
					cacheReady = true;
					const s = cached ?? {};
					setThumb(thumbOff, s.imageOff ?? "");
					setThumb(thumbOn, s.imageOn ?? "");
					applyModeVisibility(s.triggerMode);
				})();

				const live = client.didReceiveSettings;
				if (live && typeof live.subscribe === "function") {
					live.subscribe((arg) => {
						const s = arg?.payload?.settings ?? arg?.settings;
						if (s && typeof s === "object") {
							cached = s;
							applyModeVisibility(s.triggerMode);
						}
					});
				}

				const updateSetting = async (key, value) => {
					if (!cacheReady) await ready;
					// Re-read fresh state right before writing to minimise the
					// window between read and write.
					await refreshFromSdk();
					if (!cached || typeof cached !== "object") {
						console.warn(
							`dataref-toggle PI: refusing to write ${key} — no baseline settings available`,
						);
						return;
					}
					const next = { ...cached };
					if (value === undefined) delete next[key];
					else next[key] = value;
					cached = next;
					await client.setSettings(next);
				};

				const wire = (input, key, thumb) => {
					input.addEventListener("change", async () => {
						const file = input.files?.[0];
						if (!file) return;
						try {
							const raw = await readAsDataURL(file);
							const dataUrl = await resizeToPng(raw);
							setThumb(thumb, dataUrl);
							await updateSetting(key, dataUrl);
						} catch (err) {
							console.error(`Failed to read image for ${key}`, err);
						} finally {
							input.value = "";
						}
					});
				};

				wire(fileOff, "imageOff", thumbOff);
				wire(fileOn, "imageOn", thumbOn);

				const datarefField = document.getElementById("datarefField");
				const commandField = document.getElementById("commandField");
				const commandOnFieldEl = document.getElementById("commandOnField");
				const commandOffFieldEl = document.getElementById("commandOffField");
				const datarefPreview = document.getElementById("datarefPreview");
				if (window.XPlanePI && datarefField) {
					window.XPlanePI.attachAutocomplete(datarefField, "dataref");
					window.XPlanePI.attachLivePreview(datarefField, datarefPreview);
				}
				if (window.XPlanePI && commandField) {
					window.XPlanePI.attachAutocomplete(commandField, "command");
				}
				if (window.XPlanePI && commandOnFieldEl) {
					window.XPlanePI.attachAutocomplete(commandOnFieldEl, "command");
				}
				if (window.XPlanePI && commandOffFieldEl) {
					window.XPlanePI.attachAutocomplete(commandOffFieldEl, "command");
				}

				document
					.getElementById("pickOff")
					.addEventListener("click", () => fileOff.click());
				document
					.getElementById("pickOn")
					.addEventListener("click", () => fileOn.click());
				document
					.getElementById("clearOff")
					.addEventListener("click", async () => {
						setThumb(thumbOff, "");
						await updateSetting("imageOff", undefined);
					});
				document
					.getElementById("clearOn")
					.addEventListener("click", async () => {
						setThumb(thumbOn, "");
						await updateSetting("imageOn", undefined);
					});
			})();
		</script>
	</body>
</html>
