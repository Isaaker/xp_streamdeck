<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>X-Plane Command</title>
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
		<script src="xplane-pi-helpers.js"></script>
	</head>
	<body>
		<sdpi-item label="Command Path">
			<sdpi-textfield
				setting="commandPath"
				placeholder="sim/operation/pause_toggle"
				id="commandField"
				required
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Hold Mode">
			<sdpi-checkbox
				setting="holdMode"
				label="Send begin/end while held (e.g. heading bug)"
			></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Auto-Repeat">
			<sdpi-checkbox
				setting="autoRepeat"
				label="Repeat command at 5 Hz after 500 ms hold (ignored if Hold Mode is on)"
			></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Feedback">
			<sdpi-checkbox
				setting="hideConfirmation"
				label="Hide green confirmation icon on success"
			></sdpi-checkbox>
		</sdpi-item>
		<script>
			(async () => {
				const field = document.getElementById("commandField");
				if (window.XPlanePI && field) {
					await window.XPlanePI.attachAutocomplete(field, "command");
				}
			})();
		</script>
	</body>
</html>
