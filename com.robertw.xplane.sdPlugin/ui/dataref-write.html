<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>X-Plane DataRef Write</title>
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="DataRef Path">
			<sdpi-textfield
				setting="datarefPath"
				placeholder="sim/cockpit2/controls/parking_brake_ratio"
				required
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Value">
			<sdpi-textfield
				setting="value"
				placeholder="numeric value to write on press"
				inputmode="decimal"
				required
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Feedback">
			<sdpi-checkbox
				setting="hideConfirmation"
				label="Hide green confirmation icon on success"
			></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Display">
			<sdpi-checkbox
				setting="showCurrentValue"
				label="Show current DataRef value as title"
			></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Format">
			<sdpi-textfield
				setting="format"
				placeholder="%.0f° (default: %s) — only when display is on"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Unit Scale">
			<sdpi-textfield
				setting="unitScale"
				placeholder="e.g. 1.94384 (m/s → kt)"
				inputmode="decimal"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Precision">
			<sdpi-textfield
				setting="precision"
				placeholder="decimals — overridden by explicit %.Nf"
				inputmode="numeric"
			></sdpi-textfield>
		</sdpi-item>
	</body>
</html>
