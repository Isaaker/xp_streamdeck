<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>X-Plane Display Selector</title>
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Selector Key">
			<sdpi-textfield
				setting="key"
				placeholder="EDU"
				required
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Option Count">
			<sdpi-textfield
				setting="count"
				type="number"
				min="1"
				max="99"
				placeholder="4"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Default Value">
			<sdpi-textfield
				setting="defaultValue"
				type="number"
				min="1"
				max="99"
				placeholder="1"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Label (optional)">
			<sdpi-textfield
				setting="label"
				placeholder="Leave empty to show only the number"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item>
			<p style="font-size: 11px; color: #aaa; margin: 4px 0 0 0;">
				Short press cycles 1→N. Long press (≥500 ms) cycles N→1. Other buttons
				reference this selector by writing <code>{KEY}</code> in their path,
				e.g. <code>aw109/cockpit/button/edu{EDU}/2</code>.
			</p>
		</sdpi-item>
	</body>
</html>
