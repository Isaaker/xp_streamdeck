<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>X-Plane Guarded Command</title>
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
		<script src="xplane-pi-helpers.js"></script>
		<style>
			.section-hdr {
				margin: 12px 12px 4px 12px;
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: #888;
			}
			.image-upload {
				display: flex;
				align-items: center;
				gap: 8px;
				flex: 1;
			}
			.image-upload .thumb {
				width: 36px;
				height: 36px;
				border-radius: 4px;
				background: #2d2d2d center/contain no-repeat;
				border: 1px solid #444;
				flex: 0 0 auto;
				display: inline-block;
			}
			.image-upload .actions {
				display: flex;
				gap: 6px;
				flex: 1;
			}
			.image-upload button {
				cursor: pointer;
			}
			.image-upload input[type="file"] {
				display: none;
			}
		</style>
	</head>
	<body>
		<div class="section-hdr">Short press</div>
		<sdpi-item label="Command Path">
			<sdpi-textfield
				setting="shortPressCommand"
				placeholder="sim/PA46/cover/starter_toggle"
				id="shortField"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Feedback">
			<sdpi-checkbox
				setting="hideShortConfirmation"
				label="Hide green OK after short press"
			></sdpi-checkbox>
		</sdpi-item>

		<div class="section-hdr">Long press (≥ 500 ms)</div>
		<sdpi-item label="Command Path">
			<sdpi-textfield
				setting="longPressCommand"
				placeholder="sim/starters/engage_starter_1"
				id="longField"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Mode">
			<sdpi-select setting="longPressMode" default="hold">
				<option value="hold">Hold (begin / end while held)</option>
				<option value="autoRepeat">Auto-repeat 5 Hz while held</option>
				<option value="activate">Activate once at threshold</option>
			</sdpi-select>
		</sdpi-item>

		<div class="section-hdr">State indicator (optional)</div>
		<sdpi-item label="Guard DataRef">
			<sdpi-textfield
				setting="guardDataRef"
				placeholder="sim/PA46/cover/starter_open"
				id="guardField"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Value Locked">
			<sdpi-textfield
				setting="valueLocked"
				placeholder="0"
				inputmode="decimal"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Value Unlocked">
			<sdpi-textfield
				setting="valueUnlocked"
				placeholder="1"
				inputmode="decimal"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Strict Unlocked Match">
			<sdpi-checkbox setting="strictOnMatch">
				Treat only <code>value === Value Unlocked</code> as unlocked
			</sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Image Locked">
			<div class="image-upload">
				<div class="thumb" id="thumbLocked"></div>
				<div class="actions">
					<button type="button" id="pickLocked">Choose…</button>
					<button type="button" id="clearLocked">Reset</button>
				</div>
				<input
					type="file"
					id="fileLocked"
					accept="image/png,image/jpeg,image/svg+xml"
				/>
			</div>
		</sdpi-item>
		<sdpi-item label="Image Unlocked">
			<div class="image-upload">
				<div class="thumb" id="thumbUnlocked"></div>
				<div class="actions">
					<button type="button" id="pickUnlocked">Choose…</button>
					<button type="button" id="clearUnlocked">Reset</button>
				</div>
				<input
					type="file"
					id="fileUnlocked"
					accept="image/png,image/jpeg,image/svg+xml"
				/>
			</div>
		</sdpi-item>

		<script>
			(() => {
				window.XPlanePI.wireImageUpload({
					input: document.getElementById("fileLocked"),
					thumb: document.getElementById("thumbLocked"),
					pickButton: document.getElementById("pickLocked"),
					clearButton: document.getElementById("clearLocked"),
					settingKey: "imageLocked",
				});
				window.XPlanePI.wireImageUpload({
					input: document.getElementById("fileUnlocked"),
					thumb: document.getElementById("thumbUnlocked"),
					pickButton: document.getElementById("pickUnlocked"),
					clearButton: document.getElementById("clearUnlocked"),
					settingKey: "imageUnlocked",
				});

				const shortField = document.getElementById("shortField");
				const longField = document.getElementById("longField");
				const guardField = document.getElementById("guardField");
				if (shortField) window.XPlanePI.attachAutocomplete(shortField, "command");
				if (longField) window.XPlanePI.attachAutocomplete(longField, "command");
				if (guardField) window.XPlanePI.attachAutocomplete(guardField, "dataref");
			})();
		</script>
	</body>
</html>
